# Add this block inside the existing HTTPS server { ... } for api.idronline.org
# (the one certbot manages, next to the hindisearch locations), then:
#   sudo nginx -t && sudo systemctl reload nginx
# The app listens on 127.0.0.1:5000 only (BIND_HOST=127.0.0.1).

    location /image-search/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /image-search;
        client_max_body_size 20M;
        proxy_read_timeout 120s;
    }
